services:
  dns-mcp:
    build: .
    container_name: dns-mcp
    init: true  # reap orphaned healthcheck children (funes-mcp #5)
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# No published ports — Caddy reaches this container via proxy-net by container name.
# Caddy config: reverse_proxy dns-mcp:8000 (with flush_interval -1 for SSE).

networks:
  proxy-net:
    external: true
    name: proxy-net
