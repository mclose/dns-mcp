name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1

  build:
    name: Build & import-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dns-mcp:ci .

      - name: Import-check (instantiate FastMCP app, list tools)
        # Verifies pyproject deps resolve (incl. dns_tool URL dep), the
        # package imports, OAuth bootstrap routes register, and all 16
        # MCP tools are discoverable.
        env:
          POCKET_ID_BASE_URL: https://dummy.example.com
          POCKET_ID_API_KEY: dummy
          SERVER_URL: https://dummy.example.com
        run: |
          docker run --rm \
            -e POCKET_ID_BASE_URL \
            -e POCKET_ID_API_KEY \
            -e SERVER_URL \
            --entrypoint python \
            dns-mcp:ci -c "
          import asyncio
          from dns_mcp.server import create_server
          app = create_server()
          tools = asyncio.run(app.list_tools())
          assert app.name == 'dns-mcp', f'unexpected app name: {app.name}'
          assert len(tools) >= 16, f'expected >=16 tools, got {len(tools)}'
          print(f'OK: {app.name}, {len(tools)} tools registered')
          "

  # TODO: pytest job. tests/test_tools.py imports the legacy stdio
  # server.py and calls the tool functions directly. The new architecture
  # registers tools via @app.tool() decorators on a FastMCP instance, so
  # tests need to be rewritten to either:
  #   (a) call tool handler functions through app._tool_manager, or
  #   (b) hit the running server via httpx + Streamable HTTP transport.
  # Tracking issue: TODO open one after this PR merges.
