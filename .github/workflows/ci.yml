name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1

  build:
    name: Build & import-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dns-mcp:ci .

      - name: Import-check (instantiate FastMCP app, list tools)
        # Verifies pyproject deps resolve (incl. dns_tool URL dep), the
        # package imports, OAuth bootstrap routes register, and the
        # expected set of MCP tools is discoverable inside the built image.
        # Test-level coverage of registration shape lives in the Pytest
        # job; this is a build-artifact sanity check.
        env:
          POCKET_ID_BASE_URL: https://dummy.example.com
          POCKET_ID_API_KEY: dummy
          SERVER_URL: https://dummy.example.com
        run: |
          docker run --rm \
            -e POCKET_ID_BASE_URL \
            -e POCKET_ID_API_KEY \
            -e SERVER_URL \
            --entrypoint python \
            dns-mcp:ci -c "
          import asyncio
          from dns_mcp.server import create_server
          app = create_server()
          tools = asyncio.run(app.list_tools())
          assert app.name == 'dns-mcp', f'unexpected app name: {app.name}'
          assert len(tools) >= 20, f'expected >=20 tools, got {len(tools)}'
          print(f'OK: {app.name}, {len(tools)} tools registered')
          "

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run pytest
        # No env: tests/conftest.py sets Settings env at module-import,
        # before any dns_mcp import. Providing the vars here would shadow
        # the test values and break fixtures that embed them literally
        # (signed JWT issuer, discovery-doc assertions).
        run: pytest tests/ -v
