name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint + pytest + wrapper coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Pytest
        # No env: tests/conftest.py sets Settings env at import, before any
        # dns_mcp import. Providing vars here would shadow the test values.
        run: uv run --no-sync pytest -q
      - name: dns_tool wrapper coverage
        run: uv run --no-sync python scripts/check_wrapper_coverage.py

  image:
    name: Build & import-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t dns-mcp:ci .
      - name: Import-check (instantiate the app, list tools)
        run: |
          docker run --rm \
            -e POCKET_ID_BASE_URL=https://dummy.example.com \
            -e SERVER_URL=https://dummy.example.com \
            --entrypoint python dns-mcp:ci -c "
          import asyncio
          from fastmcp import Client
          from dns_mcp.server import create_server
          async def main():
              async with Client(create_server()) as c:
                  tools = await c.list_tools()
              assert len(tools) == 26, len(tools)
              print(f'OK: {len(tools)} tools')
          asyncio.run(main())
          "
