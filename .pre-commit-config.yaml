repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

# Local hooks for pytest and stdio-e2e were dropped in the 2.0.0
# Streamable HTTP rewrite. Pytest will be re-added once tests/ is
# rewritten against the new architecture.
