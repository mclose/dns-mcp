[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-mcp"
version = "2.1.0"
description = "DNS security MCP server for SOC investigations — Streamable HTTP / OAuth via Pocket ID"
requires-python = ">=3.12"
# Floors only; exact versions live in uv.lock (META-CLAUDE P16, target shape
# §2). The image runs `uv sync --locked`, so a rebuild can never pull a new
# major — that replaces the old per-dependency caps. The dns_tool wheel is
# pinned by URL: dns-mcp releases track dns_tool releases (docs/release-process.md).
dependencies = [
    "fastmcp>=4.1.6",
    "pydantic-settings>=2.7",
    "httpx[http2]>=0.27",
    # Imported directly by server.py (dns.reversename for reverse_dns).
    "dnspython>=2.6",
    "dns-tool @ https://dist.lab.deflationhollow.net/dns_tool-0.17.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/ and *.legacy are pre-2.0.0 code preserved for reference.
extend-exclude = ["tools", "*.legacy", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]
"scripts/**" = ["S603", "S607"]