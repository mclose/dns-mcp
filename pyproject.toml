[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-mcp"
version = "2.0.0"
description = "DNS security MCP server for SOC investigations — Streamable HTTP / OAuth via Pocket ID"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.6.0",
    "httpx[http2]>=0.27",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.7",
    "dns-tool @ https://dist.lab.deflationhollow.net/dns_tool-0.5.1.tar.gz",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pre-commit>=4",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Legacy files preserved during the 2.0.0 stdio→Streamable HTTP rewrite
# Until tests/ is rewritten against the new FastMCP architecture, exclude it
# from ruff. tools/ and *.legacy are pre-2.0.0 code preserved for reference.
extend-exclude = ["tests", "tools", "*.legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]