[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-mcp"
version = "2.0.0"
description = "DNS security MCP server for SOC investigations — Streamable HTTP / OAuth via Pocket ID"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.6.0",
    "httpx[http2]>=0.27",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.7",
    "dns-tool @ https://dist.lab.deflationhollow.net/dns_tool-0.11.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/ and *.legacy are pre-2.0.0 code preserved for reference.
extend-exclude = ["tools", "*.legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]